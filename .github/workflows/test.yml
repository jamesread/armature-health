name: Tests

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26']
    steps:
    - name: Checkout armature-health
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: ${{ matrix.go-version }}
    - name: Install dependencies
      run: go mod download
    - name: Install gocyclo
      run: go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0
    - name: Install golangci-lint
      uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
      with:
        version: v2.12.2
    - name: Run tests
      run: make test
    - name: Check code complexity
      run: make gocyclo
    - name: Run linter
      run: make golangci

  # Runs every test, including the SQL store ones, against MySQL and MariaDB.
  mysql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['mariadb:11', 'mysql:8.4']
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MARIADB_ROOT_PASSWORD: pw
          MYSQL_ROOT_PASSWORD: pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mariadb-admin ping -h 127.0.0.1 -ppw --silent || mysqladmin ping -h 127.0.0.1 -ppw --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
    - name: Checkout armature-health
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.26'
    - name: Run tests against ${{ matrix.image }}
      env:
        HEALTH_TEST_MYSQL_DSN: 'root:pw@tcp(127.0.0.1:3306)/'
      run: go test -count=1 -v ./...
