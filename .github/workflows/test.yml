name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26']
    steps:
    - name: Checkout armature-health
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
    - name: Install dependencies
      run: go mod download
    - name: Install gocyclo
      run: go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
    - name: Install golangci-lint
      uses: golangci/golangci-lint-action@v9.2.0
      with:
        version: latest
    - name: Run tests
      run: make test
    - name: Check code complexity
      run: make gocyclo
    - name: Run linter
      run: make golangci

  # Runs every test, including the SQL store ones, against MySQL and MariaDB.
  mysql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['mariadb:11', 'mysql:8.4']
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MARIADB_ROOT_PASSWORD: pw
          MYSQL_ROOT_PASSWORD: pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mariadb-admin ping -h 127.0.0.1 -ppw --silent || mysqladmin ping -h 127.0.0.1 -ppw --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
    - name: Checkout armature-health
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
    - name: Run tests against ${{ matrix.image }}
      env:
        HEALTH_TEST_MYSQL_DSN: 'root:pw@tcp(127.0.0.1:3306)/'
      run: go test -count=1 -v ./...
