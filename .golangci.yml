version: "2"

run:
  timeout: 5m
  tests: true

issues:
  max-same-issues: 0
  max-issues-per-linter: 0

linters:
  default: none
  enable:
    - bidichk
    - bodyclose
    - copyloopvar
    - durationcheck
    - errcheck
    - errorlint
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - noctx
    - staticcheck
    - thelper
    - unconvert
    - unused
    - usestdlibvars
  settings:
    gocyclo:
      min-complexity: 5
    govet:
      enable-all: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - gocyclo
      - path: _test\.go
        text: "fieldalignment:"
        linters:
          - govet
